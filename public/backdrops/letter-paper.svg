<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img">
  <title>Warm pressed paper with faint botanicals</title>
  <defs>
    <linearGradient id="pPaper" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="0.45" stop-color="#fdf0d6"/>
      <stop offset="1" stop-color="#fbe7c1"/>
    </linearGradient>

    <radialGradient id="pWashTop" cx="0.16" cy="0.04" r="0.6">
      <stop offset="0" stop-color="#fffdf7" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fffdf7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pWashButter" cx="0.9" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#fbe28a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fbe28a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pWashGold" cx="0.5" cy="1.04" r="0.62">
      <stop offset="0" stop-color="#f2c94c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f2c94c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pWashBlush" cx="0.04" cy="0.94" r="0.42">
      <stop offset="0" stop-color="#e89aab" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e89aab" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pWashSage" cx="0.96" cy="0.88" r="0.34">
      <stop offset="0" stop-color="#8fa88b" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8fa88b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pEdge" cx="0.5" cy="0.46" r="0.78">
      <stop offset="0.42" stop-color="#6b4f3a" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#6b4f3a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#6b4f3a" stop-opacity="0.22"/>
    </radialGradient>

    <pattern id="pGrain" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="1.05" fill="#c98b2a" opacity="0.16"/>
      <circle cx="17" cy="19" r="0.95" fill="#a9743a" opacity="0.12"/>
      <circle cx="23" cy="8" r="0.8" fill="#c98b2a" opacity="0.09"/>
      <circle cx="11" cy="14" r="0.7" fill="#8a6a3c" opacity="0.08"/>
    </pattern>

    <pattern id="pFibre" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M6 24c14 6 26-8 44-2s30 12 48 4" stroke="#c9a267" stroke-opacity="0.12" stroke-width="1" fill="none"/>
      <path d="M10 78c18-8 32 6 50 2s28-14 46-6" stroke="#c9a267" stroke-opacity="0.1" stroke-width="1" fill="none"/>
      <path d="M70 12c8 16 4 32-2 50" stroke="#c9a267" stroke-opacity="0.09" stroke-width="1" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="1200" fill="url(#pPaper)"/>
  <rect width="1200" height="1200" fill="url(#pWashTop)"/>
  <rect width="1200" height="1200" fill="url(#pWashButter)"/>
  <rect width="1200" height="1200" fill="url(#pWashGold)"/>
  <rect width="1200" height="1200" fill="url(#pWashBlush)"/>
  <rect width="1200" height="1200" fill="url(#pWashSage)"/>
  <rect width="1200" height="1200" fill="url(#pFibre)"/>
  <rect width="1200" height="1200" fill="url(#pGrain)"/>

  <!-- a long pressed vine, wandering across the sheet as texture rather than a motif -->
  <g fill="none" stroke="#a9743a" stroke-opacity="0.16" stroke-width="2.4" stroke-linecap="round">
    <path d="M-30 316c168-92 320 74 486-4s302-96 470-16 300 60 320-14"/>
    <path d="M232 262c22-24 46-30 68-16M420 330c-6-30 6-52 30-64M700 296c-30-14-44-38-38-66M912 322c24-26 52-32 78-14"/>
    <path d="M-30 936c150 84 300-60 458 6s292 92 462 8 296-48 340 22"/>
  </g>

  <!-- leaf and seed sprigs, spread wide so any crop still catches some -->
  <g fill="none" stroke="#8fa88b" stroke-opacity="0.2" stroke-width="2.2" stroke-linecap="round">
    <path d="M96 176c-30 34-36 70-20 100M96 176c30 26 40 58 34 92M96 176c-6 40 2 76 22 106"/>
    <path d="M1180 262c-34-20-64-22-88-4M1180 262c-30 24-58 36-86 30"/>
    <path d="M64 700c26 22 44 48 50 78M64 700c-6 30 0 58 16 82"/>
    <path d="M1140 648c-30 12-52 34-64 62M1140 648c-4 34 6 64 28 88"/>
  </g>
  <g fill="#8fa88b" fill-opacity="0.14">
    <ellipse cx="70" cy="272" rx="20" ry="9" transform="rotate(-24 70 272)"/>
    <ellipse cx="136" cy="252" rx="18" ry="8" transform="rotate(20 136 252)"/>
    <ellipse cx="92" cy="742" rx="19" ry="8" transform="rotate(28 92 742)"/>
    <ellipse cx="1108" cy="700" rx="20" ry="9" transform="rotate(-26 1108 700)"/>
    <ellipse cx="1156" cy="292" rx="18" ry="8" transform="rotate(16 1156 292)"/>
  </g>

  <!-- a pressed flower, bottom-left, the way it would be taped into a scrapbook -->
  <g opacity="0.17">
    <g fill="#e89aab">
      <ellipse cx="196" cy="1052" rx="26" ry="14" transform="rotate(-20 196 1052)"/>
      <ellipse cx="222" cy="1074" rx="26" ry="14" transform="rotate(45 222 1074)"/>
      <ellipse cx="200" cy="1104" rx="26" ry="14" transform="rotate(100 200 1104)"/>
      <ellipse cx="166" cy="1094" rx="26" ry="14" transform="rotate(-70 166 1094)"/>
      <ellipse cx="160" cy="1058" rx="26" ry="14" transform="rotate(-140 160 1058)"/>
    </g>
    <circle cx="190" cy="1078" r="11" fill="#e6b23c"/>
    <path d="M188 1092c-4 34-2 60 8 84" stroke="#8fa88b" stroke-width="2.6" fill="none"/>
  </g>

  <!-- a second, paler blossom, top-right -->
  <g opacity="0.13">
    <g fill="#f2c94c">
      <ellipse cx="1020" cy="126" rx="22" ry="12" transform="rotate(-16 1020 126)"/>
      <ellipse cx="1044" cy="146" rx="22" ry="12" transform="rotate(48 1044 146)"/>
      <ellipse cx="1022" cy="170" rx="22" ry="12" transform="rotate(104 1022 170)"/>
      <ellipse cx="994" cy="152" rx="22" ry="12" transform="rotate(-64 994 152)"/>
    </g>
    <circle cx="1018" cy="148" r="9" fill="#a9743a"/>
  </g>

  <!-- two little envelopes, doodled in the margins -->
  <g fill="none" stroke="#a9743a" stroke-opacity="0.18" stroke-width="2.4" stroke-linejoin="round">
    <path d="M1042 462c22-.6 44-.6 66 0 .8 18 .8 36 0 54-22 .8-44 .8-66 0-.8-18-.8-36 0-54Z"/>
    <path d="M1044 464 1075 492 1106 464"/>
    <path d="M96 512c18-.5 36-.5 54 0 .7 15 .7 30 0 45-18 .6-36 .6-54 0-.7-15-.7-30 0-45Z"/>
    <path d="M98 514 123 538 148 514"/>
  </g>

  <!-- handwritten marks and dotted guide lines, kept faint -->
  <g fill="none" stroke="#6b4f3a" stroke-opacity="0.14" stroke-width="2" stroke-linecap="round">
    <path d="M420 96c18-14 34-12 48 6s30 20 46 4"/>
    <path d="M760 1052c20-16 38-12 52 8s32 18 48 0"/>
    <path d="M360 1116c26-12 54-12 84 0"/>
  </g>
  <g fill="#a9743a" fill-opacity="0.18">
    <circle cx="300" cy="1024" r="3.4"/>
    <circle cx="330" cy="1024" r="3.4"/>
    <circle cx="360" cy="1024" r="3.4"/>
    <circle cx="390" cy="1024" r="3.4"/>
    <circle cx="300" cy="1050" r="3.4"/>
    <circle cx="330" cy="1050" r="3.4"/>
    <circle cx="360" cy="1050" r="3.4"/>
    <circle cx="390" cy="1050" r="3.4"/>
  </g>

  <!-- warm flecks of dust, baked in so even a still screen has life -->
  <g fill="#c98b2a" opacity="0.22">
    <circle cx="248" cy="626" r="3"/>
    <circle cx="880" cy="742" r="3.6"/>
    <circle cx="560" cy="196" r="2.6"/>
    <circle cx="1152" cy="856" r="3"/>
    <circle cx="404" cy="880" r="2.4"/>
    <circle cx="92" cy="392" r="2.6"/>
    <circle cx="1006" cy="352" r="2.2"/>
    <circle cx="712" cy="982" r="2.8"/>
  </g>

  <rect width="1200" height="1200" fill="url(#pEdge)"/>
</svg>
