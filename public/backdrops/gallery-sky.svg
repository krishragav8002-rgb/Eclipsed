<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img">
  <title>Midnight sky with a luminous moon</title>
  <defs>
    <linearGradient id="gSky" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2b2150"/>
      <stop offset="0.5" stop-color="#241b3d"/>
      <stop offset="1" stop-color="#1d1633"/>
    </linearGradient>

    <radialGradient id="gBloomTop" cx="0.72" cy="0.06" r="0.62">
      <stop offset="0" stop-color="#c7b1f2" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#c7b1f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gBloomLeft" cx="0.08" cy="0.26" r="0.5">
      <stop offset="0" stop-color="#7556b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7556b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gBloomLow" cx="0.5" cy="1.02" r="0.62">
      <stop offset="0" stop-color="#7556b8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7556b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gBloomIcy" cx="0.28" cy="0.62" r="0.4">
      <stop offset="0" stop-color="#b9c8ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b9c8ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gMoonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7f3ff" stop-opacity="0.55"/>
      <stop offset="0.32" stop-color="#c7b1f2" stop-opacity="0.4"/>
      <stop offset="0.68" stop-color="#9b8adf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9b8adf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gMoonBody" cx="0.38" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f7f3ff"/>
      <stop offset="1" stop-color="#ded2fb"/>
    </radialGradient>

    <radialGradient id="gWisp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8cdf0" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#c7b1f2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c7b1f2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#gSky)"/>
  <rect width="1200" height="1200" fill="url(#gBloomTop)"/>
  <rect width="1200" height="1200" fill="url(#gBloomLeft)"/>
  <rect width="1200" height="1200" fill="url(#gBloomIcy)"/>
  <rect width="1200" height="1200" fill="url(#gBloomLow)"/>

  <!-- soft cloud wisps, so the sky has weather rather than a flat wash -->
  <g fill="url(#gWisp)">
    <ellipse cx="300" cy="360" rx="420" ry="86"/>
    <ellipse cx="870" cy="250" rx="380" ry="72"/>
    <ellipse cx="560" cy="560" rx="470" ry="70" opacity="0.75"/>
    <ellipse cx="1010" cy="640" rx="330" ry="62" opacity="0.6"/>
    <ellipse cx="210" cy="760" rx="360" ry="58" opacity="0.55"/>
    <ellipse cx="640" cy="920" rx="430" ry="66" opacity="0.5"/>
  </g>

  <!-- the moon: a wide atmospheric halo, a bright disc, a few soft craters -->
  <circle cx="756" cy="360" r="360" fill="url(#gMoonGlow)"/>
  <circle cx="756" cy="360" r="152" fill="#f7f3ff" opacity="0.16"/>
  <circle cx="756" cy="360" r="98" fill="url(#gMoonBody)"/>
  <g fill="#d3c5f4" opacity="0.5">
    <ellipse cx="722" cy="332" rx="20" ry="16"/>
    <ellipse cx="792" cy="386" rx="14" ry="12"/>
    <ellipse cx="744" cy="404" rx="10" ry="9" opacity="0.8"/>
    <ellipse cx="800" cy="326" rx="8" ry="7" opacity="0.7"/>
  </g>
  <circle cx="756" cy="360" r="98" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.4"/>

  <!-- a deep field of stars -->
  <g fill="#f7f3ff">
    <circle cx="96" cy="128" r="2.4" opacity="0.85"/>
    <circle cx="188" cy="72" r="1.6" opacity="0.6"/>
    <circle cx="286" cy="196" r="2" opacity="0.7"/>
    <circle cx="352" cy="96" r="1.4" opacity="0.5"/>
    <circle cx="430" cy="168" r="2.6" opacity="0.9"/>
    <circle cx="498" cy="64" r="1.6" opacity="0.62"/>
    <circle cx="566" cy="212" r="1.8" opacity="0.68"/>
    <circle cx="640" cy="120" r="2.2" opacity="0.8"/>
    <circle cx="912" cy="86" r="2.6" opacity="0.9"/>
    <circle cx="1004" cy="176" r="1.8" opacity="0.65"/>
    <circle cx="1092" cy="112" r="2.2" opacity="0.78"/>
    <circle cx="1156" cy="228" r="1.5" opacity="0.55"/>
    <circle cx="1064" cy="330" r="1.8" opacity="0.6"/>
    <circle cx="1130" cy="452" r="2.2" opacity="0.72"/>
    <circle cx="66" cy="352" r="1.8" opacity="0.6"/>
    <circle cx="144" cy="470" r="2.4" opacity="0.82"/>
    <circle cx="238" cy="560" r="1.5" opacity="0.5"/>
    <circle cx="86" cy="636" r="2" opacity="0.68"/>
    <circle cx="326" cy="682" r="1.7" opacity="0.58"/>
    <circle cx="412" cy="742" r="2.2" opacity="0.72"/>
    <circle cx="512" cy="664" r="1.5" opacity="0.52"/>
    <circle cx="604" cy="776" r="1.9" opacity="0.64"/>
    <circle cx="714" cy="700" r="1.4" opacity="0.48"/>
    <circle cx="826" cy="782" r="2.2" opacity="0.7"/>
    <circle cx="930" cy="700" r="1.6" opacity="0.55"/>
    <circle cx="1032" cy="772" r="2" opacity="0.66"/>
    <circle cx="1128" cy="690" r="1.5" opacity="0.5"/>
    <circle cx="1176" cy="560" r="2.2" opacity="0.7"/>
    <circle cx="1078" cy="546" r="1.6" opacity="0.52"/>
    <circle cx="176" cy="880" r="1.9" opacity="0.6"/>
    <circle cx="372" cy="930" r="1.5" opacity="0.5"/>
    <circle cx="536" cy="886" r="2.1" opacity="0.66"/>
    <circle cx="742" cy="944" r="1.5" opacity="0.5"/>
    <circle cx="918" cy="890" r="1.9" opacity="0.6"/>
    <circle cx="1084" cy="948" r="1.5" opacity="0.48"/>
    <circle cx="256" cy="1042" r="1.8" opacity="0.55"/>
    <circle cx="618" cy="1064" r="1.5" opacity="0.48"/>
    <circle cx="980" cy="1062" r="1.8" opacity="0.55"/>
  </g>

  <!-- a handful of hand-drawn sparkles among the stars -->
  <g fill="none" stroke="#e8e0ff" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
    <path d="M356 320c.9 5.6 1.7 6.4 7.3 7.3-5.6.9-6.4 1.7-7.3 7.3-.9-5.6-1.7-6.4-7.3-7.3 5.6-.9 6.4-1.7 7.3-7.3Z"/>
    <path d="M1044 452c.7 4.4 1.4 5.1 5.8 5.8-4.4.7-5.1 1.4-5.8 5.8-.7-4.4-1.4-5.1-5.8-5.8 4.4-.7 5.1-1.4 5.8-5.8Z"/>
    <path d="M176 216c.7 4.4 1.4 5.1 5.8 5.8-4.4.7-5.1 1.4-5.8 5.8-.7-4.4-1.4-5.1-5.8-5.8 4.4-.7 5.1-1.4 5.8-5.8Z"/>
  </g>

  <!-- two faint constellations, drawn the way they would be sketched -->
  <g fill="none" stroke="#c7b1f2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <path d="M120 268 214 214 306 262 396 200"/>
    <path d="M944 596 1030 546 1118 604"/>
  </g>
  <g fill="#f7f3ff">
    <circle cx="120" cy="268" r="3" opacity="0.8"/>
    <circle cx="214" cy="214" r="3.4" opacity="0.85"/>
    <circle cx="306" cy="262" r="3" opacity="0.8"/>
    <circle cx="396" cy="200" r="3.4" opacity="0.85"/>
    <circle cx="944" cy="596" r="2.8" opacity="0.75"/>
    <circle cx="1030" cy="546" r="3.2" opacity="0.8"/>
    <circle cx="1118" cy="604" r="2.8" opacity="0.75"/>
  </g>
</svg>
